<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥚 電子雞 復刻版 Pro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap');

  :root {
    --lcd-bg: #8bac0f;
    --lcd-dark: #0f380f;
    --lcd-mid: #306230;
    --lcd-light: #9bbc0f;
    --shell-main: #f5c518;
    --shell-dark: #c9a010;
    --shell-shadow: #8a6d00;
    --shell-btn: #e8b000;
    --btn-red: #e74c3c;
    --btn-blue: #2980b9;
    --btn-green: #27ae60;
    --screen-glow: rgba(139,172,15,0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    position: relative;
  }

  /* 星星背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 70%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 80%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 60%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 15%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 45%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 55%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 85%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 25%, white 0%, transparent 100%);
    pointer-events: none;
    animation: twinkle 3s infinite alternate;
  }

  @keyframes twinkle { from{opacity:0.6} to{opacity:1} }

  .title {
    color: #f5c518;
    font-size: 14px;
    text-shadow: 0 0 10px #f5c518, 0 2px 0 #8a6d00;
    margin-bottom: 20px;
    letter-spacing: 3px;
    animation: titlePulse 2s infinite alternate;
  }
  @keyframes titlePulse {
    from { text-shadow: 0 0 10px #f5c518, 0 2px 0 #8a6d00; }
    to   { text-shadow: 0 0 20px #f5c518, 0 0 40px #ffdd57, 0 2px 0 #8a6d00; }
  }

  /* ── 裝置外殼 ── */
  .device {
    position: relative;
    width: 280px;
    background: linear-gradient(160deg, var(--shell-main) 0%, #ffdd57 30%, var(--shell-dark) 70%, var(--shell-shadow) 100%);
    border-radius: 50% 50% 45% 45% / 40% 40% 50% 50%;
    padding: 25px 20px 40px;
    box-shadow:
      0 0 0 4px var(--shell-shadow),
      0 0 0 7px #5a4500,
      8px 15px 35px rgba(0,0,0,0.6),
      inset 0 3px 8px rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.2);
    border: 3px solid var(--shell-shadow);
  }

  /* 裝飾小點 */
  .device::before {
    content: '★';
    position: absolute;
    top: 18px; left: 25px;
    font-size: 14px;
    color: var(--shell-shadow);
    opacity: 0.6;
  }
  .device::after {
    content: '♥';
    position: absolute;
    top: 18px; right: 25px;
    font-size: 14px;
    color: var(--shell-shadow);
    opacity: 0.6;
  }

  /* ── LCD 螢幕框 ── */
  .screen-frame {
    background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
    border-radius: 16px;
    padding: 10px;
    margin: 10px 5px 15px;
    box-shadow:
      inset 0 0 15px rgba(0,0,0,0.8),
      0 0 0 2px #555,
      0 0 20px var(--screen-glow);
    position: relative;
  }

  .screen {
    background: var(--lcd-bg);
    border-radius: 10px;
    width: 210px;
    height: 175px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
  }

  /* LCD 掃描線效果 */
  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.05) 2px,
      rgba(0,0,0,0.05) 4px
    );
    pointer-events: none;
    border-radius: 10px;
  }

  /* ── 狀態列 ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px 2px;
    border-bottom: 2px solid var(--lcd-mid);
  }
  .status-icon {
    font-size: 9px;
    color: var(--lcd-dark);
    display: flex; align-items: center; gap: 3px;
    font-family: 'Press Start 2P', monospace;
  }

  /* ── 寵物畫布 ── */
  .pet-area {
    height: 105px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  canvas#petCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ── 訊息列 ── */
  .message-bar {
    border-top: 2px solid var(--lcd-mid);
    padding: 4px 6px;
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .message-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--lcd-dark);
    text-align: center;
    line-height: 1.6;
    animation: msgBlink 0.5s step-end infinite;
  }
  @keyframes msgBlink { 50% { opacity: 0.7; } }

  /* ── 狀態指標 ── */
  .stats-panel {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 4px 8px 2px;
    border-top: 2px solid var(--lcd-mid);
  }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stat-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--lcd-dark);
    width: 50px;
  }
  .stat-bar {
    flex: 1;
    height: 7px;
    background: var(--lcd-light);
    border: 1px solid var(--lcd-mid);
    position: relative;
    overflow: hidden;
  }
  .stat-fill {
    height: 100%;
    background: var(--lcd-dark);
    transition: width 0.3s;
    image-rendering: pixelated;
  }
  .stat-val {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--lcd-dark);
    width: 24px;
    text-align: right;
  }

  /* ── 按鈕列 ── */
  .buttons-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 15px;
    margin-top: 5px;
  }

  .btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .btn-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    color: var(--shell-shadow);
    letter-spacing: 1px;
  }

  .btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: transform 0.08s, box-shadow 0.08s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn::after {
    content: '';
    position: absolute;
    top: 4px; left: 6px;
    width: 12px; height: 6px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    transform: rotate(-30deg);
  }
  .btn:active { transform: scale(0.88); }

  .btn-A {
    background: radial-gradient(circle at 35% 35%, #ff6b6b, var(--btn-red));
    box-shadow: 0 5px 0 #c0392b, 0 6px 10px rgba(0,0,0,0.4);
  }
  .btn-A:active { box-shadow: 0 2px 0 #c0392b, 0 3px 6px rgba(0,0,0,0.3); }

  .btn-B {
    background: radial-gradient(circle at 35% 35%, #5dade2, var(--btn-blue));
    box-shadow: 0 5px 0 #1a6fa0, 0 6px 10px rgba(0,0,0,0.4);
  }
  .btn-B:active { box-shadow: 0 2px 0 #1a6fa0, 0 3px 6px rgba(0,0,0,0.3); }

  .btn-C {
    background: radial-gradient(circle at 35% 35%, #58d68d, var(--btn-green));
    box-shadow: 0 5px 0 #1e8449, 0 6px 10px rgba(0,0,0,0.4);
  }
  .btn-C:active { box-shadow: 0 2px 0 #1e8449, 0 3px 6px rgba(0,0,0,0.3); }

  /* ── 選單覆蓋層 ── */
  .menu-overlay {
    position: absolute;
    inset: 0;
    background: var(--lcd-bg);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    padding: 6px;
    z-index: 10;
    max-height: 175px;
    overflow-y: auto;
  }
  .menu-overlay.active { display: flex; }
  .menu-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--lcd-dark);
    text-align: center;
    border-bottom: 2px solid var(--lcd-mid);
    padding-bottom: 4px;
    margin-bottom: 4px;
  }
  .menu-item {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--lcd-dark);
    padding: 5px 6px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .menu-item.selected {
    background: var(--lcd-dark);
    color: var(--lcd-bg);
    border-radius: 3px;
  }
  .menu-cursor { font-size: 8px; }

  /* 動畫效果 */
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-4px)}
    40%{transform:translateX(4px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
  @keyframes jump {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
  }
  @keyframes spin {
    from{transform:rotate(0deg)} to{transform:rotate(360deg)}
  }
  @keyframes deviceShake {
    0%,100%{transform:rotate(0deg)}
    25%{transform:rotate(-3deg)}
    75%{transform:rotate(3deg)}
  }

  .device.shake { animation: deviceShake 0.4s ease; }

  /* 通知彈出 */
  .notif {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: #f5c518;
    color: #1a1a1a;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 3px solid #8a6d00;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 100;
    white-space: nowrap;
  }
  .notif.show { transform: translateX(-50%) translateY(0); }

  /* 死亡畫面 */
  .death-screen {
    position: absolute;
    inset: 0;
    background: var(--lcd-bg);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    gap: 6px;
  }
  .death-screen.active { display: flex; }
  .death-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--lcd-dark);
    text-align: center;
    line-height: 2;
  }

  /* 孵蛋動畫覆蓋 */
  .hatch-screen {
    position: absolute;
    inset: 0;
    background: var(--lcd-bg);
    border-radius: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 15;
  }
  .hatch-screen.active { display: flex; }

  /* 暫停覆蓋層 */
  .pause-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,56,15,0.8);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 25;
    gap: 15px;
  }
  .pause-overlay.active { display: flex; }
  .pause-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #9bbc0f;
    text-align: center;
    animation: pausePulse 1s infinite alternate;
  }
  @keyframes pausePulse {
    from { opacity: 0.6; }
    to { opacity: 1; }
  }
  .pause-info {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #9bbc0f;
    text-align: center;
    line-height: 2;
  }

  /* 難度/設定選單 */
  .settings-overlay {
    position: absolute;
    inset: 0;
    background: var(--lcd-bg);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    padding: 8px;
    z-index: 22;
    overflow-y: auto;
  }
  .settings-overlay.active { display: flex; }
  .settings-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--lcd-dark);
    text-align: center;
    border-bottom: 2px solid var(--lcd-mid);
    padding-bottom: 6px;
    margin-bottom: 8px;
  }
  .settings-item {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--lcd-dark);
    padding: 6px 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--lcd-mid);
  }
  .settings-item.selected {
    background: var(--lcd-dark);
    color: var(--lcd-bg);
    border-radius: 3px;
    border-bottom: 1px solid var(--lcd-dark);
  }

  /* 底部版本 */
  .version {
    color: rgba(255,255,255,0.3);
    font-size: 7px;
    margin-top: 15px;
    letter-spacing: 2px;
  }

  /* 控制提示 */
  .controls-hint {
    color: rgba(255,255,255,0.4);
    font-size: 6px;
    margin-top: 10px;
    text-align: center;
    line-height: 1.8;
  }

  /* 響應式 */
  @media (max-height: 700px) {
    .device { transform: scale(0.85); }
    .title { font-size: 10px; margin-bottom: 10px; }
  }
</style>
</head>
<body>

<div class="title">🥚 電子雞 復刻版 Pro</div>

<div class="device" id="device">

  <!-- LCD 螢幕框 -->
  <div class="screen-frame">
    <div class="screen" id="screen">

      <!-- 狀態列 -->
      <div class="status-bar">
        <div class="status-icon" id="ageDisplay">AGE:0</div>
        <div class="status-icon" id="weightDisplay">WT:5g</div>
        <div class="status-icon" id="timeDisplay">00:00</div>
      </div>

      <!-- 寵物畫布 -->
      <div class="pet-area">
        <canvas id="petCanvas" width="80" height="80"></canvas>
      </div>

      <!-- 訊息列 -->
      <div class="message-bar">
        <div class="message-text" id="msgText">按 A 開始遊戲！</div>
      </div>

      <!-- 狀態指標 -->
      <div class="stats-panel">
        <div class="stat-row">
          <div class="stat-label">🍖飢餓</div>
          <div class="stat-bar"><div class="stat-fill" id="hungerBar" style="width:80%"></div></div>
          <div class="stat-val" id="hungerVal">8</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">😊快樂</div>
          <div class="stat-bar"><div class="stat-fill" id="happyBar"  style="width:80%"></div></div>
          <div class="stat-val" id="happyVal">8</div>
        </div>
      </div>

      <!-- 選單覆蓋 -->
      <div class="menu-overlay" id="menuOverlay">
        <div class="menu-title" id="menuTitle">選擇行動</div>
        <div id="menuItems"></div>
      </div>

      <!-- 暫停覆蓋 -->
      <div class="pause-overlay" id="pauseOverlay">
        <div class="pause-text">⏸ 暫 停 中 ⏸</div>
        <div class="pause-info">按 A 繼續遊戲</div>
      </div>

      <!-- 設定選單 -->
      <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-title" id="settingsTitle">設定</div>
        <div id="settingsItems"></div>
      </div>

      <!-- 死亡畫面 -->
      <div class="death-screen" id="deathScreen">
        <canvas id="ghostCanvas" width="50" height="50"></canvas>
        <div class="death-text" id="deathText">電子雞\n離開了...\n\n按 A 重生</div>
      </div>

      <!-- 孵蛋畫面 -->
      <div class="hatch-screen" id="hatchScreen">
        <canvas id="eggCanvas" width="60" height="60"></canvas>
      </div>
    </div>
  </div>

  <!-- 三顆按鈕 -->
  <div class="buttons-row">
    <div class="btn-wrap">
      <button class="btn btn-A" id="btnA" onclick="handleBtn('A')">🍖</button>
      <div class="btn-label">A</div>
    </div>
    <div class="btn-wrap">
      <button class="btn btn-B" id="btnB" onclick="handleBtn('B')">🎮</button>
      <div class="btn-label">B</div>
    </div>
    <div class="btn-wrap">
      <button class="btn btn-C" id="btnC" onclick="handleBtn('C')">💊</button>
      <div class="btn-label">C</div>
    </div>
  </div>
</div>

<div class="version">VER 2.0 PRO © 2024 RETRO EDITION</div>

<div class="controls-hint">
  ⌨️ 鍵盤: A/↑ | B/↓ | C/→ | P/暫停 | S/設定
</div>

<!-- 通知 -->
<div class="notif" id="notif"></div>

<script>
// ═══════════════════════════════════════════
//  電子雞 完整遊戲引擎 v2.0 Pro
//  新增功能：暫停、存檔、聲音、難度調整
// ═══════════════════════════════════════════

const canvas = document.getElementById('petCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const ghostCanvas = document.getElementById('ghostCanvas');
const gctx = ghostCanvas.getContext('2d');

const eggCanvas = document.getElementById('eggCanvas');
const ectx = eggCanvas.getContext('2d');

// ── 顏色調色盤 (LCD風格) ──
const C = {
  bg:    '#8bac0f',
  d0:    '#0f380f',
  d1:    '#306230',
  d2:    '#8bac0f',
  d3:    '#9bbc0f',
  none:  null
};

// ═══════════════════════════════════════════
//  音效系統 (使用 Web Audio API)
// ═══════════════════════════════════════════
class AudioManager {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.initAudio();
  }

  initAudio() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {
        console.log('Audio API 不支援');
        this.enabled = false;
      }
    }
  }

  playSound(type) {
    if (!this.enabled || !this.ctx) return;
    
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      switch(type) {
        case 'button':
          osc.frequency.value = 800;
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
          break;

        case 'feed':
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.linearRampToValueAtTime(800, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
          break;

        case 'happy':
          osc.frequency.setValueAtTime(1000, now);
          osc.frequency.linearRampToValueAtTime(1200, now + 0.15);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
          break;

        case 'sad':
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.linearRampToValueAtTime(200, now + 0.3);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
          break;

        case 'death':
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(100, now + 0.5);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
          break;

        case 'evolve':
          for(let i = 0; i < 3; i++) {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g);
            g.connect(this.ctx.destination);
            o.frequency.value = 600 + i * 200;
            g.gain.setValueAtTime(0.08, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.15);
          }
          break;

        case 'menu':
          osc.frequency.value = 700;
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
          break;
      }
    } catch(e) {
      console.log('音效播放失敗:', e);
